# =============================================================================
#  SMOKE TESTS — Manual trigger only
#  Runs all scenarios tagged @SmokeTest
#  Trigger: GitHub UI → Actions → Smoke Tests → Run workflow
# =============================================================================

name: Smoke Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to test against"
        required: false
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  smoke:
    name: Run @SmokeTest scenarios
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Karate JAR
        uses: actions/cache@v4
        with:
          path: karate-2.0.10.jar
          key: karate-jar-${{ hashFiles('karate-2.0.10.jar') }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Run Smoke Tests
        shell: pwsh
        env:
          KARATE_LOGBACK : logback-ci.xml
          AUTH_TOKEN     : ${{ secrets.AUTH_TOKEN }}
          API_KEY        : ${{ secrets.API_KEY }}
          CLIENT_ID      : ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET  : ${{ secrets.CLIENT_SECRET }}
        run: |
          ./karate.ps1 tags "@SmokeTest" `
            -KarateEnv "${{ inputs.environment }}" `
            -Output "target/karate-reports"

      - name: Upload Smoke Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ github.run_number }}
          path: target/karate-reports/
          retention-days: 7

      - name: Teardown Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Post-Test Cleanup Summary ==="
          Write-Host "WebSocket connections closed by afterScenario hooks."
          Write-Host "REST objects deleted by afterScenario hooks (PostCall, ReusableFeature)."
          Write-Host "DummyJSON token expires automatically (no logout endpoint)."
          $summaryFile = Get-ChildItem "target/karate-reports" -Filter "karate-summary.json" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($summaryFile) {
            $s = Get-Content $summaryFile.FullName | ConvertFrom-Json
            Write-Host "Passed: $($s.scenariosPassed) | Failed: $($s.scenariosFailed)"
          }

      # ── Quality Metrics & Reporting ──────────────────────────────────────────
      - name: Download previous metrics log
        if: always()
        uses: dawidd6/action-download-artifact@v3
        with:
          name_is_regexp: true
          name: quality-metrics-.*
          path: metrics/
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Extract quality metrics
        if: always()
        shell: pwsh
        run: |
          .\scripts\extract-metrics.ps1 `
            -Phase "smoke" `
            -RunId "${{ github.run_number }}" `
            -Environment "${{ inputs.environment }}"

      - name: Generate combined quality report
        if: always()
        shell: pwsh
        run: .\scripts\generate-combined-report.ps1

      - name: Post summary to Step Summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "reports/quality-summary.txt") {
            Get-Content "reports/quality-summary.txt" |
              Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }

      - name: Upload quality metrics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-metrics-${{ github.run_number }}
          path: |
            metrics/
            reports/
          retention-days: 30
